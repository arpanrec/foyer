---
name: CodeQL

on:
    push:
        branches: ["main"]
    pull_request:
    merge_group:
    schedule:
        - cron: "23 18 * * 2"
    workflow_dispatch:

permissions: {}

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        if: github.server_url == 'https://github.com' && github.repository == 'arpanrec/foyer'
        runs-on: ubuntu-26.04
        permissions:
            actions: read
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                language: [actions, javascript-typescript]
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Initialize CodeQL
              uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none
                  queries: security-extended

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                  category: "/language:${{ matrix.language }}"
