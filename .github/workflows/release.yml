name: Release

on:
    push:
        tags:
            - "*"

permissions: {}

jobs:
    release:
        name: Create GitHub Release
        if: github.server_url == 'https://github.com' && github.repository == 'arpanrec/foyer'
        runs-on: ubuntu-26.04
        permissions:
            contents: write
        steps:
            - name: Create release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                  if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                      echo "Release $TAG already exists"
                      exit 0
                  fi
                  prerelease=()
                  if [[ "$TAG" == *-* ]]; then
                      prerelease=(--prerelease)
                  fi
                  gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${prerelease[@]}"
